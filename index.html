th:245px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#7a8799;text-align:left;background:#f8fafd;padding:11px 14px;border-bottom:1px solid var(--line)}td{padding:12px 14px;border-bottom:1px solid #edf1f6;font-size:13px}tbody tr:hover{background:#f8fbff}tbody tr:last-child td{border-bottom:0}.code{font-weight:800;letter-spacing:.03em}.muted{color:var(--muted)}.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border-radius:99px;font-size:10px;font-weight:750;background:#eef2f7;color:#56677d}.badge.green{background:#e7f7ef;color:#14764e}.badge.amber{background:#fff3dd;color:#946000}.badge.red{background:#fdecec;color:#a33238}.badge.blue{background:#e9f2ff;color:#1a5bc2}.badge.gray{background:#f0f2f5;color:#69778a}.flightbrand{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:8px;color:#fff;font-weight:800;font-size:10px;margin-right:8px;vertical-align:middle}.tabs{display:flex;gap:5px;border-bottom:1px solid var(--line);margin-bottom:17px}.tab{background:none;border:0;color:#69788c;padding:10px 13px;border-bottom:2px solid transparent;font-weight:700}.tab.active{color:var(--blue);border-color:var(--blue)}.counter-layout{display:grid;grid-template-columns:minmax(300px,390px) 1fr;gap:16px;align-items:start}.pass-list{max-height:calc(100vh - 340px);overflow:auto}.pass-item{padding:12px 14px;border-bottom:1px solid #edf1f6;cursor:pointer}.pass-item:hover,.pass-item.active{background:#f0f6ff}.pass-item.active{box-shadow:inset 3px 0 var(--blue)}.pass-name{font-weight:750}.pass-meta{color:var(--muted);font-size:11px;margin-top:3px}.pass-item .row{justify-content:space-between}.passenger-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.passenger-head h2{font-size:22px;margin:0}.info-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:15px 0}.info-box{background:#f7f9fc;border:1px solid #edf1f6;padding:10px;border-radius:8px}.info-box small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.06em}.info-box b{display:block;margin-top:5px}.section-title{font-size:12px;font-weight:800;margin:19px 0 9px}.seat-map{display:grid;grid-template-columns:repeat(7,minmax(32px,1fr));gap:6px;max-width:540px}.seat{border:1px solid #cfd9e6;background:#fff;border-radius:6px;padding:7px 3px;text-align:center;font-size:10px;color:#476078}.seat.occupied{background:#edf0f4;color:#9aa6b4;border-color:#e1e6ec}.seat.selected{background:#dcebff;color:#145cc4;border-color:#4688ef;font-weight:800}.seat.blocked{background:#fff4df;color:#9d650b;border-color:#f0d39b}.seat-row{display:contents}.aisle{grid-column:4}.seat-legend{display:flex;gap:12px;font-size:10px;color:var(--muted);margin:8px 0}.legendbox{display:inline-block;width:10px;height:10px;border:1px solid #cfd9e6;border-radius:3px;margin-right:4px;vertical-align:-1px}.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px}.empty{text-align:center;color:var(--muted);padding:36px 18px}.toast{position:fixed;bottom:22px;right:24px;background:#172943;color:white;padding:12px 16px;border-radius:9px;box-shadow:var(--shadow);z-index:10;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translateY(0)}.modal-back{position:fixed;inset:0;background:#0c172b77;display:grid;place-items:center;padding:18px;z-index:20}.modal{background:white;width:min(560px,100%);border-radius:14px;box-shadow:0 20px 70px #06112755;max-height:90vh;overflow:auto}.modal-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.modal-head h2{font-size:17px;margin:0}.modal-body{padding:20px}.modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.check-row{display:flex;align-items:flex-start;gap:9px;padding:8px 0}.check-row input{margin-top:3px}.check-row small{display:block;color:var(--muted)}.notice{padding:11px 13px;border-radius:8px;background:#fff6e7;color:#815500;font-size:12px;margin:10px 0}.notice.info{background:#edf5ff;color:#315d91}.metric-line{display:flex;gap:12px}.metric-line>div{flex:1;border:1px solid var(--line);border-radius:9px;padding:10px}.metric-line b{display:block;font-size:19px}.metric-line small{color:var(--muted)}.hidden{display:none!important}.check{color:var(--green);font-weight:800}.danger-text{color:var(--red)}.airline-chip{display:inline-flex;align-items:center;gap:7px}.footnote{font-size:11px;color:var(--muted);line-height:1.5}.activity{display:grid;gap:11px}.activity-item{border-left:2px solid #d6e4f7;padding-left:11px;font-size:12px}.activity-item small{display:block;color:var(--muted);margin-top:2px}
@media(max-width:1050px){.shell{grid-template-columns:70px 1fr}.side{padding:18px 9px}.brand{justify-content:center;padding:0}.brand>div:not(.brand-mark),.workspace,.nav button .nav-label,.side-bottom{display:none}.nav button{justify-content:center;font-size:17px}.content{padding:22px 18px}.counter-layout{grid-template-columns:300px 1fr}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:730px){.topbar{padding:0 15px}.content{padding:18px 12px}.page-head{align-items:flex-start;flex-direction:column}.counter-layout{grid-template-columns:1fr}.pass-list{max-height:280px}.info-grid{grid-template-columns:repeat(2,1fr)}.two-col{grid-template-columns:1fr}.clock{display:none}.form-grid{grid-template-columns:1fr}.stats{gap:9px}.stat{padding:13px}.stat strong{font-size:22px}}

<body>
<div class="shell">
  <aside class="side">
    <div class="brand"><div class="brand-mark">L</div><div><b>LWI AIRPORT OPS</b><small>Passenger services</small></div></div>
    <div><div class="workspace">Operations</div><nav class="nav" id="nav">
      <button data-page="overview" class="active"><span class="ico">▦</span><span class="nav-label">Overview</span></button>
      <button data-page="counter"><span class="ico">▣</span><span class="nav-label">Check-in counter</span></button>
      <button data-page="flights"><span class="ico">✈</span><span class="nav-label">Flight board</span></button>

  </aside>
  <main class="main"><header class="topbar"><div class="crumb">LWI Operations <span class="muted">/</span> <b id="crumb">Overview</b></div><div class="top-actions"><span class="clock" id="clock"></span><div class="agent"><div class="avatar">ZR</div><div><b>Zane Rentfro</b><small>Counter agent · C-04</small></div></div></div></header><div class="content" id="content"></div></main>
</div><div class="toast" id="toast"></div><div id="modal-root"></div>
<script>
(()=>{
const airlines=[
 {code:'UA',name:'United Airlines',color:'#153b73',gates:'A1–A27',prefix:'United',groups:['United Polaris / First','Premier 1K','Group 1','Group 2','Group 3','Group 4','Group 5','Basic Economy']},
 {code:'AA',name:'American Airlines',color:'#b92835',gates:'B1–B14',prefix:'American',groups:['Flagship / First','ConciergeKey','Group 1','Group 2','Group 3','Group 4','Group 5','Groups 6–9']},
 {code:'B6',name:'JetBlue',color:'#003876',gates:'B15–B24',prefix:'JetBlue',groups:['Mint / Mosaic 4','Mosaic 1–3','Even More Space','Group A','Group B','Group C','Group D','Group E']},
 {code:'AS',name:'Alaska Airlines',color:'#01426a',gates:'B25–B30',prefix:'Alaska',groups:['First Class','Atmos Rewards 100K','Group A','Group B','Group C','Group D','Group E']},
 {code:'WN',name:'Southwest',color:'#2367aa',gates:'C1–C26',prefix:'Southwest',groups:['Preboarding','A-List Preferred','Group A','Group B','Group C','Family boarding']},
 {code:'MX',name:'Breeze Airways',color:'#142b48',gates:'C27–C30',prefix:'Breeze',groups:['Nice / Nicer / Nicest','Priority','Group 1','Group 2','Group 3']},
 {code:'DL',name:'Delta Air Lines',color:'#9b1c32',gates:'D1–D19',prefix:'Delta',groups:['Delta One / First','Diamond / Platinum','Zone 1','Zone 2','Zone 3','Zone 4','Zone 5','Zone 6']},
 {code:'F9',name:'Frontier Airlines',color:'#167c3c',gates:'D20–D29',prefix:'Frontier',groups:['Priority','Zone 1','Zone 2','Zone 3','Zone 4','Zone 5']},
 {code:'NK',name:'Spirit Airlines',color:'#ffcf00',gates:'D30–D35',prefix:'Spirit',groups:['Big Front Seat','Priority','Zone 1','Zone 2','Zone 3','Zone 4']},
 {code:'G4',name:'Allegiant Air',color:'#007c91',gates:'D36–D40',prefix:'Allegiant',groups:['Priority','Group 1','Group 2','Group 3','Group 4']},
 {code:'SY',name:'Sun Country',color:'#0075a9',gates:'D41',prefix:'Sun Country',groups:['Priority','Zone 1','Zone 2','Zone 3','Zone 4']},
 {code:'HA',name:'Hawaiian Airlines',color:'#54245e',gates:'D42–D45',prefix:'Hawaiian',groups:['First Class','Premier Club','Zone 1','Zone 2','Zone 3','Zone 4','Zone 5']},
 {code:'AV',name:'Avelo Airlines',color:'#0054a6',gates:'A28–A30',prefix:'Avelo',groups:['Priority','Group 1','Group 2','Group 3']}
];
const routes={UA:[['SFO','San Francisco'],['ORD','Chicago O’Hare'],['DEN','Denver'],['IAH','Houston'],['EWR','Newark']],AA:[['DFW','Dallas/Fort Worth'],['CLT','Charlotte'],['PHX','Phoenix'],['MIA','Miami']],B6:[['BOS','Boston'],['JFK','New York JFK'],['FLL','Fort Lauderdale']],AS:[['SEA','Seattle'],['PDX','Portland'],['SFO','San Francisco']],WN:[['DAL','Dallas Love Field'],['MDW','Chicago Midway'],['PHX','Phoenix'],['DEN','Denver']],MX:[['CHS','Charleston'],['TPA','Tampa'],['LAS','Las Vegas']],DL:[['ATL','Atlanta'],['DTW','Detroit'],['MSP','Minneapolis'],['SLC','Salt Lake City']],F9:[['DEN','Denver'],['LAS','Las Vegas'],['MCO','Orlando']],NK:[['FLL','Fort Lauderdale'],['LAS','Las Vegas'],['MCO','Orlando']],G4:[['LAS','Las Vegas'],['PIE','St. Pete–Clearwater'],['AZA','Phoenix-Mesa']],SY:[['MSP','Minneapolis'],['PHX','Phoenix'],['MCO','Orlando']],HA:[['HNL','Honolulu'],['OGG','Kahului']],AV:[['MCO','Orlando'],['TPA','Tampa'],['LAS','Las Vegas']]};
const first=['Avery','Jordan','Taylor','Morgan','Riley','Casey','Jamie','Cameron','Drew','Alex','Parker','Quinn','Reese','Skyler','Rowan','Logan','Hayden','Emerson','Elliot','Dakota','Sage','Payton','Kendall','Blake'];
const last=['Anderson','Bennett','Carter','Diaz','Ellis','Foster','Garcia','Hughes','Irwin','Johnson','Kim','Lopez','Miller','Nguyen','Owens','Patel','Reed','Shaw','Turner','Wright','Young','Zimmerman'];
const now=new Date();let selectedFlight='';let selectedPassenger='';let page='overview';let filter='';let activity=[];let activeTab='checkin';
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function seed(){let fl=[],pax=[];let n=1;airlines.forEach((a,ai)=>{for(let j=0;j<2;j++){let r=routes[a.code][j%routes[a.code].length],num=String(100+ai*23+j*7).padStart(3,'0');let dep=new Date(now);dep.setHours(6+ai%10+j*3,10+j*25,0,0);let id=a.code+num;fl.push({id,airline:a.code,flight:id,destination:r[0],city:r[1],departure:dep.toISOString(),gate:gateFor(a,ai,j),status:'Scheduled',capacity:150+((ai*7+j*11)%90),terminal:'T1'});let count=24+(ai*9+j*13)%24;for(let k=0;k<count;k++){let f=first[(k*3+ai*2+j)%first.length],l=last[(k*5+ai+j*3)%last.length];let seatNo=(k%30+1)+['A','B','C','D','E','F'][k%6];pax.push({id:`${id}-${String(k+1).padStart(3,'0')}`,flightId:id,first:f,last:l,record:(f[0]+l.slice(0,3)+num).toUpperCase(),seat:k%9===0?'':seatNo,checked:k%4===0,boardingPass:k%4===0,group:a.groups[k%a.groups.length],bags:k%7===0?1:0,bagTags:[],bagWeight:[],docStatus:k%13===0?'Review required':'Verified',docType:k%8===0?'Passport':'Government ID',special:k%17===0?'Wheelchair assistance':k%21===0?'Unaccompanied minor':'',notes:'',fare:k%10===0?'Basic':k%8===0?'First':'Standard',email:`${f.toLowerCase()}.${l.toLowerCase()}@example.com`,phone:`(555) 01${String((ai*77+k*13)%100).padStart(2,'0')}-${String((k*137+ai)%10000).padStart(4,'0')}`,priority:k%12===0,ssr:k%17===0?'WCHR':k%21===0?'UMNR':''});n++}}});return {flights:fl,passengers:pax}}
function gateFor(a,ai,j){if(a.code==='UA')return `A${1+(ai*3+j)%27}`;if(a.code==='AA')return `B${1+(ai+j)%14}`;if(a.code==='B6')return `B${15+(ai+j)%10}`;if(a.code==='AS')return `B${25+(ai+j)%6}`;if(a.code==='WN')return `C${1+(ai*2+j)%26}`;if(a.code==='MX')return `C${27+(j%4)}`;if(a.code==='DL')return `D${1+(ai*2+j)%19}`;if(a.code==='F9')return `D${20+(j%10)}`;if(a.code==='NK')return `D${30+(j%6)}`;if(a.code==='G4')return `D${36+(j%5)}`;if(a.code==='SY')return 'D41';if(a.code==='HA')return `D${42+j}`;return `A${28+j}`}
let data;try{data=JSON.parse(localStorage.getItem('lwi-checkin-v1'))}catch{}if(!data||!data.flights||!data.passengers)data=seed();
const save=()=>localStorage.setItem('lwi-checkin-v1',JSON.stringify(data));const airline=c=>airlines.find(x=>x.code===c)||airlines[0];const flight=id=>data.flights.find(x=>x.id===id);const pax=id=>data.passengers.find(x=>x.id===id);const flightPax=id=>data.passengers.filter(x=>x.flightId===id);const time=d=>new Date(d).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});const dateTime=d=>new Date(d).toLocaleString([], {weekday:'short',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
function record(msg,detail=''){activity.unshift({at:new Date().toISOString(),msg,detail});activity=activity.slice(0,100);save()}
function toast(s){const t=$('#toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2300)}
function badge(s){let cls=/Checked|Boarding pass issued|Verified|Open|Scheduled|Available/i.test(s)?'green':/Review|Pending|Standby|Delayed|Limited/i.test(s)?'amber':/Cancelled|Closed|Error/i.test(s)?'red':/Not checked|No seat|Needs/i.test(s)?'gray':'blue';return `<span class="badge ${cls}">${esc(s)}</span>`}
function header(title,desc,actions=''){return `<div class="page-head"><div><div class="eyebrow">LWI · Passenger services</div><h1>${title}</h1><p class="sub">${desc}</p></div><div class="toolbar">${actions}</div></div>`}
function stat(label,value,trend,icon){return `<div class="card stat"><div class="stat-top"><span>${label}</span><span>${icon}</span></div><strong>${value}</strong><div class="trend">${trend}</div></div>`}
function render(){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#crumb').textContent=({overview:'Overview',counter:'Check-in counter',flights:'Flight board',passengers:'Passenger search',bags:'Baggage & exceptions',activity:'Activity log'})[page];$('#content').innerHTML=({overview:overview,counter:counter,flights:flightsPage,passengers:passengersPage,bags:bagsPage,activity:activityPage})[page]();bindPage()}
function overview(){let total=data.passengers.length,checked=data.passengers.filter(p=>p.checked).length,needs=data.passengers.filter(p=>p.docStatus!=='Verified').length,bags=data.passengers.reduce((a,p)=>a+p.bags,0);let upcoming=[...data.flights].sort((a,b)=>new Date(a.departure)-new Date(b.departure)).slice(0,8);return `${header('Check-in overview','Live passenger processing across all LWI operating airlines.',`<button class="btn primary" data-go="counter">Open check-in counter&nbsp; →</button>`)}<div class="grid stats">${stat('Passengers in sample',total,'Across '+airlines.length+' airline brands','♙')}${stat('Checked in',checked,`${Math.round(checked/Math.max(total,1)*100)}% of sample passengers`,'✓')}${stat('Document review',needs,'Passengers needing agent review','!')}${stat('Checked bags',bags,'Bag count across all flights','▤')}</div><div class="grid" style="grid-template-columns:minmax(0,1.7fr) minmax(260px,.8fr)"><section class="card"><div class="card-head"><h2>Upcoming departures</h2><button class="btn small" data-go="flights">All flights</button></div><div class="table-wrap"><table><thead><tr><th>Flight</th><th>Destination</th><th>Departure</th><th>Gate</th><th>Checked in</th><th>Status</th></tr></thead><tbody>${upcoming.map(f=>{let a=airline(f.airline),ps=flightPax(f.id),checked=ps.filter(p=>p.checked).length;return `<tr data-open-flight="${f.id}"><td><span class="flightbrand" style="background:${a.color}">${a.code}</span><span class="code">${f.id}</span><div class="muted" style="padding-left:39px;font-size:10px">${a.name}</div></td><td>${f.city}<div class="muted">${f.destination}</div></td><td>${time(f.departure)}</td><td>${f.gate}</td><td>${checked} / ${ps.length}</td><td>${badge(f.status)}</td></tr>`}).join('')}</tbody></table></div></section><section class="card"><div class="card-head"><h2>Station pulse</h2><span class="badge green">NORMAL</span></div><div class="card-body"><div class="activity">${activity.slice(0,5).map(x=>`<div class="activity-item">${esc(x.msg)}<small>${dateTime(x.at)}${x.detail?' · '+esc(x.detail):''}</small></div>`).join('')||'<div class="muted">No station actions yet. Check in a passenger to start the activity log.</div>'}</div><div class="notice info" style="margin-top:18px">Demo environment · passenger names, bookings, and flight data are generated sample records. No airline systems are connected.</div></div></section></div>`}
function flightsPage(){let query=filter.toLowerCase();let list=data.flights.filter(f=>{let a=airline(f.airline);return `${f.id} ${f.destination} ${f.city} ${f.gate} ${a.name}`.toLowerCase().includes(query)}).sort((a,b)=>new Date(a.departure)-new Date(b.departure));return `${header('Flight board','Select a flight to open its passenger list and counter workflow.',`<button class="btn" data-action="reset">↻ Reset simulation</button><button class="btn primary" data-action="new-flight">＋ Add flight</button>`)}<div class="card"><div class="card-head"><h2>Departures <span class="badge blue">${list.length} flights</span></h2><div class="toolbar"><input class="input search" id="flight-search" placeholder="Search flight, airline, city, gate…" value="${esc(filter)}"></div></div><div class="table-wrap"><table><thead><tr><th>Airline / flight</th><th>Destination</th><th>Departure</th><th>Gate</th><th>Cabin capacity</th><th>Check-in</th><th>Flight status</th><th></th></tr></thead><tbody>${list.map(f=>{let a=airline(f.airline),ps=flightPax(f.id),c=ps.filter(p=>p.checked).length;return `<tr><td><span class="flightbrand" style="background:${a.color}">${a.code}</span><span class="code">${f.id}</span><div class="muted" style="padding-left:39px;font-size:10px">${a.name}</div></td><td>${f.city}<div class="muted">${f.destination}</div></td><td>${dateTime(f.departure)}</td><td><b>${f.gate}</b></td><td>${ps.length} / ${f.capacity}</td><td><span class="badge ${c===ps.length?'green':'blue'}">${c} checked</span></td><td>${badge(f.status)}</td><td><button class="btn small primary" data-select-flight="${f.id}">Open counter</button></td></tr>`}).join('')}</tbody></table>${list.length?'':'<div class="empty">No flights match your search.</div>'}</div></div><p class="footnote" style="margin-top:12px">Airline check-in group names and gate ranges follow the simulation setup. Flight timings are local to LWI.</p>`}
function counter(){if(!selectedFlight||!flight(selectedFlight))selectedFlight=data.flights[0]?.id||'';let f=flight(selectedFlight);if(!f)return `${header('Check-in counter','No flights available. Add a flight to begin.')}`;let a=airline(f.airline);let ps=flightPax(f.id).filter(p=>`${p.first} ${p.last} ${p.record} ${p.id}`.toLowerCase().includes(filter.toLowerCase()));let p=pax(selectedPassenger);if(!p||p.flightId!==f.id)p=ps[0]||null;if(p)selectedPassenger=p.id;let checked=flightPax(f.id).filter(x=>x.checked).length;return `${header('Check-in counter','Passenger processing workstation · Select a passenger or find a reservation.',`<select id="counter-flight" class="input">${data.flights.map(x=>`<option value="${x.id}" ${x.id===f.id?'selected':''}>${x.id} · ${airline(x.airline).name} · ${x.destination} · ${time(x.departure)}</option>`).join('')}</select>`)}<div class="card" style="padding:13px 16px;margin-bottom:16px;border-left:4px solid ${a.color}"><div class="row between"><div class="airline-chip"><span class="flightbrand" style="background:${a.color}">${a.code}</span><div><b>${a.name} ${f.id}</b><div class="muted">${f.city} (${f.destination}) · ${dateTime(f.departure)} · Gate ${f.gate}</div></div></div><div class="row"><span>${badge(f.status)}</span><span class="badge blue">${checked}/${flightPax(f.id).length} checked in</span><span class="badge gray">${a.gates}</span></div></div></div><div class="counter-layout"><section class="card"><div class="card-head"><div><h2>Passenger manifest</h2><div class="muted" style="font-size:11px;margin-top:3px">${flightPax(f.id).length} reservations</div></div><button class="btn small" data-action="add-pax">＋</button></div><div class="card-body" style="padding-bottom:11px"><input id="pax-search" class="input" style="width:100%" placeholder="Name, record locator, or traveler ID" value="${esc(filter)}"></div><div class="pass-list">${ps.map(x=>`<div class="pass-item ${p?.id===x.id?'active':''}" data-passenger="${x.id}"><div class="row"><span class="pass-name">${esc(x.last)}, ${esc(x.first)}</span>${x.checked?'<span class="badge green">Checked in</span>':x.docStatus!=='Verified'?'<span class="badge amber">Review</span>':'<span class="badge gray">Not checked</span>'}</div><div class="pass-meta">${x.record} · ${x.seat||'Seat unassigned'} · ${x.bags} bag${x.bags===1?'':'s'}</div></div>`).join('')||'<div class="empty">No passenger matches. Try a different search.</div>'}</div><div class="card-body"><button class="btn" style="width:100%" data-action="add-pax">＋ Add walk-up passenger</button></div></section><section class="card">${p?passengerPanel(p,f,a):'<div class="empty">Choose a passenger to start check-in.</div>'}</section></div>`}
function passengerPanel(p,f,a){let seatRows=Array.from({length:Math.ceil(Math.max(24,f.capacity)/6)},(_,i)=>i+1);return `<div class="card-head"><div class="passenger-head" style="width:100%"><div><div class="eyebrow">${p.record} · ${p.id}</div><h2>${esc(p.first)} ${esc(p.last)}</h2><div class="muted">${esc(p.email)} · ${esc(p.phone)}</div></div><div>${p.checked?'<span class="badge green">CHECKED IN</span>':'<span class="badge gray">NOT CHECKED IN</span>'}</div></div></div><div class="card-body"><div class="tabs"><button class="tab ${activeTab==='checkin'?'active':''}" data-tab="checkin">Check-in</button><button class="tab ${activeTab==='seat'?'active':''}" data-tab="seat">Seat map</button><button class="tab ${activeTab==='documents'?'active':''}" data-tab="documents">Documents & SSR</button><button class="tab ${activeTab==='history'?'active':''}" data-tab="history">Reservation</button></div>${activeTab==='checkin'?`<div class="info-grid"><div class="info-box"><small>Flight</small><b>${f.id} → ${f.destination}</b></div><div class="info-box"><small>Seat</small><b>${p.seat||'Not assigned'}</b></div><div class="info-box"><small>Boarding group</small><b>${esc(p.group)}</b></div><div class="info-box"><small>Fare / cabin</small><b>${esc(p.fare)} · ${p.fare==='First'?'First':'Economy'}</b></div></div><div class="two-col"><div><div class="section-title">Checked baggage</div><div class="row"><button class="btn small" data-action="bag-minus" ${p.bags<=0?'disabled':''}>−</button><b style="font-size:17px;min-width:30px;text-align:center">${p.bags}</b><button class="btn small" data-action="bag-plus">＋ Add bag</button></div><div class="footnote" style="margin-top:7px">${p.bags?`${p.bags} bag tag${p.bags===1?'':'s'} ready · ${p.bagWeight.reduce((x,y)=>x+y,0)||p.bags*34} lb estimated`:'No bags checked'} · Fees are simulated.</div></div><div><div class="section-title">Travel document</div><div class="row">${badge(p.docStatus)}<span class="muted">${esc(p.docType)}</span><button class="btn small" data-action="verify-doc">Review</button></div><div class="footnote" style="margin-top:7px">Destination rules are not connected. Agent review is a simulation flag only.</div></div></div><div class="section-title">Passenger services</div><div class="toolbar"><label class="check-row"><input type="checkbox" data-toggle="priority" ${p.priority?'checked':''}> Priority handling</label><select class="input" id="special-select"><option value="">No special service</option>${['Wheelchair assistance','Unaccompanied minor','Vision assistance','Hearing assistance','Extra seat','Traveling with infant'].map(x=>`<option ${p.special===x?'selected':''}>${x}</option>`).join('')}</select><button class="btn small" data-action="save-ssr">Save service</button></div><div class="section-title">Ready to issue</div><div class="row" style="flex-wrap:wrap"><button class="btn primary" data-action="checkin" ${p.checked?'disabled':''}>${p.checked?'✓ Checked in':'Check in passenger'}</button><button class="btn" data-action="boarding-pass" ${!p.checked?'disabled':''}>▤ Print boarding pass</button><button class="btn" data-action="bag-tags" ${p.bags===0?'disabled':''}>▤ Print bag tags</button><button class="btn" data-action="undo-checkin" ${!p.checked?'disabled':''}>Undo check-in</button></div>${p.checked?`<div class="notice info">Boarding pass issued · ${p.id} · ${p.seat||'Seat pending'} · Group ${esc(p.group)}</div>`:''}`:activeTab==='seat'?`${seatMap(p,f)}`:activeTab==='documents'?`${documentsPanel(p)}`:`<div class="info-grid"><div class="info-box"><small>Record locator</small><b>${p.record}</b></div><div class="info-box"><small>Reservation status</small><b>${p.checked?'Checked in':'Confirmed'}</b></div><div class="info-box"><small>Contact email</small><b>${p.email}</b></div><div class="info-box"><small>Phone</small><b>${p.phone}</b></div></div><div class="section-title">Agent notes</div><textarea class="input" id="notes" style="width:100%;min-height:90px" placeholder="Add a local note for this passenger">${esc(p.notes)}</textarea><div style="margin-top:8px"><button class="btn small" data-action="save-notes">Save note</button></div><div class="notice info">Reservation data is held only in this browser's local simulation storage.</div>`}</div>`}
function seatMap(p,f){let used=flightPax(f.id).filter(x=>x.seat&&x.id!==p.id).map(x=>x.seat);let opts=[];for(let r=1;r<=Math.ceil(f.capacity/6);r++){for(let l of ['A','B','C','D','E','F']){let s=r+l;if(used.includes(s))opts.push(`<button class="seat occupied" disabled title="Assigned">${s}</button>`);else opts.push(`<button class="seat ${p.seat===s?'selected':''}" data-seat="${s}">${s}</button>`);if(l==='C')opts.push('<span class="aisle"></span>')}}return `<div class="section-title">Choose a seat · ${esc(p.first)} ${esc(p.last)}</div><div class="seat-legend"><span><i class="legendbox"></i>Available</span><span><i class="legendbox" style="background:#edf0f4"></i>Assigned</span><span><i class="legendbox" style="background:#dcebff;border-color:#4688ef"></i>Selected</span></div><div class="seat-map">${opts.join('')}</div><p class="footnote">Seat assignments in this simulation use a 3–3 layout. Occupied seats cannot be selected. Premium cabin rules and aircraft-specific maps are not connected yet.</p><button class="btn" data-action="clear-seat">Clear seat assignment</button>`}
function documentsPanel(p){return `<div class="section-title">Document checks</div><div class="info-grid"><div class="info-box"><small>Document presented</small><b>${esc(p.docType)}</b></div><div class="info-box"><small>Current check status</small><b>${badge(p.docStatus)}</b></div><div class="info-box"><small>Passenger name</small><b>${esc(p.first)} ${esc(p.last)}</b></div><div class="info-box"><small>Traveler record</small><b>${p.record}</b></div></div><div class="notice">This is a training simulation. It does not validate passports, visas, identity documents, Secure Flight records, or destination entry requirements.</div><div class="toolbar"><button class="btn primary" data-action="verify-doc">Mark document reviewed</button><button class="btn warn" data-action="flag-doc">Flag for supervisor</button><button class="btn" data-action="doc-type">Change document type</button></div><div class="section-title">Special service requests</div><div class="row">${p.special?badge(p.special):'<span class="muted">No SSR recorded</span>'} ${p.ssr?badge(p.ssr):''}</div><p class="footnote">Requests are recorded locally for the counter simulation and do not transmit to airport or airline systems.</p>`}
function passengersPage(){let q=filter.toLowerCase();let list=data.passengers.filter(p=>`${p.first} ${p.last} ${p.record} ${p.id} ${p.flightId}`.toLowerCase().includes(q)).slice(0,100);return `${header('Passenger search','Find a traveler across the station and open their check-in record.',`<input id="global-pax-search" class="input search" placeholder="Name, record locator, flight…" value="${esc(filter)}">`)}<div class="card"><div class="card-head"><h2>Passenger records <span class="badge blue">${list.length}${q?' results':' shown'}</span></h2><span class="muted">Search all operating airlines</span></div><div class="table-wrap"><table><thead><tr><th>Passenger</th><th>Record locator</th><th>Flight</th><th>Seat</th><th>Bags</th><th>Document</th><th>Status</th><th></th></tr></thead><tbody>${list.map(p=>`<tr><td><b>${esc(p.first)} ${esc(p.last)}</b><div class="muted">${esc(p.email)}</div></td><td class="code">${p.record}</td><td>${p.flightId} · ${flight(p.flightId)?.destination}</td><td>${p.seat||'—'}</td><td>${p.bags}</td><td>${badge(p.docStatus)}</td><td>${p.checked?badge('Checked in'):badge('Not checked in')}</td><td><button class="btn small" data-open-pax="${p.id}">Open</button></td></tr>`).join('')}</tbody></table>${list.length?'':'<div class="empty">No passenger records match this search.</div>'}</div></div>`}
function bagsPage(){let list=data.passengers.filter(p=>p.bags>0||p.docStatus!=='Verified'||p.special||!p.checked).sort((a,b)=>(a.docStatus==='Verified')-(b.docStatus==='Verified')).slice(0,100);return `${header('Baggage & exceptions','Review bag counts, document flags, and special-service requests across flights.') }<div class="grid stats">${stat('Passengers with bags',data.passengers.filter(p=>p.bags).length,'At least one bag tag to process','▤')}${stat('Total bags',data.passengers.reduce((n,p)=>n+p.bags,0),'Estimated count across flights','▧')}${stat('Document review',data.passengers.filter(p=>p.docStatus!=='Verified').length,'Manual review flagged','!')}${stat('Special services',data.passengers.filter(p=>p.special).length,'SSR requests on records','♿')}</div><div class="card"><div class="card-head"><h2>Station exceptions</h2><input id="exception-search" class="input search" placeholder="Filter passenger / flight" value="${esc(filter)}"></div><div class="table-wrap"><table><thead><tr><th>Passenger</th><th>Flight</th><th>Bags / tags</th><th>Documents</th><th>Special request</th><th>Check-in</th><th></th></tr></thead><tbody>${list.filter(p=>`${p.first} ${p.last} ${p.flightId}`.toLowerCase().includes(filter.toLowerCase())).map(p=>`<tr><td><b>${p.last}, ${p.first}</b><div class="muted">${p.record}</div></td><td>${p.flightId}</td><td>${p.bags} · ${p.bagTags.join(', ')||'No tags issued'}</td><td>${badge(p.docStatus)}</td><td>${p.special?badge(p.special):'—'}</td><td>${p.checked?badge('Checked in'):badge('Not checked in')}</td><td><button class="btn small" data-open-pax="${p.id}">Review</button></td></tr>`).join('')}</tbody></table></div></div>`}
function activityPage(){return `${header('Activity log','Recent actions at this station. Entries are stored in the current browser session.') }<div class="card"><div class="card-head"><h2>Agent activity</h2><button class="btn small danger" data-action="clear-activity">Clear log</button></div><div class="card-body"><div class="activity">${activity.map(x=>`<div class="activity-item"><b>${esc(x.msg)}</b><small>${dateTime(x.at)}${x.detail?' · '+esc(x.detail):''}</small></div>`).join('')||'<div class="empty">No actions recorded yet.</div>'}</div></div></div>`}
function bindPage(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));document.querySelectorAll('[data-select-flight]').forEach(b=>b.onclick=()=>{selectedFlight=b.dataset.selectFlight;selectedPassenger='';filter='';go('counter')});document.querySelectorAll('[data-open-flight]').forEach(b=>b.onclick=()=>{selectedFlight=b.dataset.openFlight;selectedPassenger='';filter='';go('counter')});document.querySelectorAll('[data-open-pax]').forEach(b=>b.onclick=()=>{let p=pax(b.dataset.openPax);selectedFlight=p.flightId;selectedPassenger=p.id;filter='';go('counter')});let fs=$('#flight-search');if(fs)fs.oninput=e=>{filter=e.target.value;let pos=e.target.selectionStart;render();let n=$('#flight-search');n.focus();n.setSelectionRange(pos,pos)};let gps=$('#global-pax-search');if(gps)gps.oninput=e=>{filter=e.target.value;let pos=e.target.selectionStart;render();let n=$('#global-pax-search');n.focus();n.setSelectionRange(pos,pos)};let es=$('#exception-search');if(es)es.oninput=e=>{filter=e.target.value;render();$('#exception-search').focus()};let cs=$('#counter-flight');if(cs)cs.onchange=()=>{selectedFlight=cs.value;selectedPassenger='';filter='';render()};let ps=$('#pax-search');if(ps)ps.oninput=e=>{filter=e.target.value;let pos=e.target.selectionStart;render();let n=$('#pax-search');n.focus();n.setSelectionRange(pos,pos)};document.querySelectorAll('[data-passenger]').forEach(b=>b.onclick=()=>{selectedPassenger=b.dataset.passenger;activeTab='checkin';render()});document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;render()});document.querySelectorAll('[data-seat]').forEach(b=>b.onclick=()=>{let p=pax(selectedPassenger),s=b.dataset.seat;if(!p)return;p.seat=s;record(`Seat ${s} assigned`,`${p.first} ${p.last} · ${p.flightId}`);save();render();toast(`Seat ${s} assigned`)});document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action));let tog=$('[data-toggle="priority"]');if(tog)tog.onchange=()=>{let p=pax(selectedPassenger);p.priority=tog.checked;record('Priority handling updated',`${p.first} ${p.last} · ${p.flightId}`);save();toast('Passenger service updated')};let doc=$('#doc-type-select');if(doc)doc.onchange=()=>{let p=pax(selectedPassenger);p.docType=doc.value;save()}}
function action(a){let p=pax(selectedPassenger),f=flight(selectedFlight);if(a==='reset'){modal('Reset simulation','This replaces local demo changes with the original generated flights and passengers.',`<button class="btn danger" id="confirm-reset">Reset all demo data</button>`,()=>{$('#confirm-reset').onclick=()=>{localStorage.removeItem('lwi-checkin-v1');data=seed();activity=[];selectedFlight=data.flights[0].id;selectedPassenger='';filter='';save();closeModal();go('overview');toast('Simulation reset')}});return}if(a==='new-flight'){newFlight();return}if(a==='add-pax'){newPassenger();return}if(a==='clear-activity'){activity=[];save();render();return}if(!p)return;
 if(a==='bag-plus'){p.bags++;let tag=`${f.id}-${String(Math.floor(Math.random()*9000)+1000)}`;p.bagTags.push(tag);p.bagWeight.push(34);record('Bag added and tag created',`${p.first} ${p.last} · ${tag}`);save();render();toast(`Bag tag ${tag} created`)}
 if(a==='bag-minus'){if(p.bags>0){p.bags--;p.bagTags.pop();p.bagWeight.pop();record('Bag removed',`${p.first} ${p.last} · ${p.flightId}`);save();render()}}
 if(a==='verify-doc'){p.docStatus='Verified';record('Travel document reviewed',`${p.first} ${p.last} · ${p.docType}`);save();render();toast('Document marked reviewed')}
 if(a==='flag-doc'){p.docStatus='Supervisor review';record('Document escalated to supervisor',`${p.first} ${p.last} · ${p.flightId}`);save();render();toast('Passenger flagged for supervisor')}
 if(a==='doc-type'){modal('Document type',`Update document type for ${p.first} ${p.last}.`,`<div class="field"><label>Presented document</label><select id="doc-type-select" class="input">${['Government ID','Passport','Military ID','Permanent resident card','Other approved ID'].map(x=>`<option ${p.docType===x?'selected':''}>${x}</option>`).join('')}</select></div>`,`<button class="btn primary" id="save-doc-type">Save document type</button>`,()=>{$('#save-doc-type').onclick=()=>{let val=$('#doc-type-select').value;p.docType=val;record('Document type updated',`${p.first} ${p.last} · ${val}`);save();closeModal();render()}});return}
 if(a==='checkin'){if(p.docStatus!=='Verified'){toast('Review the travel document before check-in');activeTab='documents';render();return}if(!p.seat){let seat=firstAvailableSeat(f,p);if(seat)p.seat=seat}p.checked=true;p.boardingPass=true;record('Passenger checked in; boarding pass issued',`${p.first} ${p.last} · ${p.flightId} · ${p.seat||'no seat'}`);save();render();toast('Passenger checked in; boarding pass ready')}
 if(a==='boarding-pass'){record('Boarding pass reprinted',`${p.first} ${p.last} · ${p.flightId}`);toast('Boarding pass queued for print')}
 if(a==='bag-tags'){record('Bag tags reprinted',`${p.first} ${p.last} · ${p.bagTags.join(', ')}`);toast('Bag tags queued for print')}
 if(a==='undo-checkin'){p.checked=false;p.boardingPass=false;record('Check-in reversed',`${p.first} ${p.last} · ${p.flightId}`);save();render();toast('Check-in reversed')}
 if(a==='clear-seat'){p.seat='';record('Seat assignment cleared',`${p.first} ${p.last} · ${p.flightId}`);save();render()}
 if(a==='save-ssr'){p.special=$('#special-select').value;p.ssr=p.special==='Wheelchair assistance'?'WCHR':p.special==='Unaccompanied minor'?'UMNR':p.special?'OTHS':'';record('Passenger service request updated',`${p.first} ${p.last} · ${p.special||'none'}`);save();render();toast('Service request saved')}
 if(a==='save-notes'){p.notes=$('#notes').value;record('Reservation note saved',`${p.first} ${p.last} · ${p.flightId}`);save();toast('Note saved')}
}
function firstAvailableSeat(f,p){for(let r=1;r<=Math.ceil(f.capacity/6);r++)for(let l of ['A','B','C','D','E','F'])if(!flightPax(f.id).some(x=>x.id!==p.id&&x.seat===r+l))return r+l;return ''}
function modal(title,body,footer,after){$('#modal-root').innerHTML=`<div class="modal-back" id="modal-back"><div class="modal"><div class="modal-head"><h2>${title}</h2><button class="btn small" id="modal-close">✕</button></div><div class="modal-body">${body}</div><div class="modal-foot">${footer||'<button class="btn" id="modal-cancel">Cancel</button>'}</div></div></div>`;$('#modal-close').onclick=closeModal;$('#modal-cancel')?.addEventListener('click',closeModal);$('#modal-back').addEventListener('click',e=>{if(e.target.id==='modal-back')closeModal()});after?.()}
function closeModal(){$('#modal-root').innerHTML=''}
function newFlight(){modal('Add flight','Create a simulated departure and add it to the station board.',`<div class="form-grid"><div class="field"><label>Airline</label><select id="nf-airline" class="input">${airlines.map(a=>`<option value="${a.code}">${a.name} (${a.code})</option>`).join('')}</select></div><div class="field"><label>Flight number</label><input id="nf-num" class="input" placeholder="e.g. 245"></div><div class="field"><label>Destination airport</label><input id="nf-dest" class="input" placeholder="e.g. LAX" maxlength="3"></div><div class="field"><label>Destination city</label><input id="nf-city" class="input" placeholder="e.g. Los Angeles"></div><div class="field"><label>Departure time</label><input id="nf-time" type="datetime-local" class="input"></div><div class="field"><label>Gate</label><input id="nf-gate" class="input" placeholder="e.g. A10"></div><div class="field"><label>Capacity</label><input id="nf-cap" type="number" min="1" max="400" value="180" class="input"></div></div>`,`<button class="btn primary" id="create-flight">Create flight</button>`,()=>{$('#create-flight').onclick=()=>{let ac=$('#nf-airline').value,num=$('#nf-num').value.trim(),dest=$('#nf-dest').value.trim().toUpperCase(),city=$('#nf-city').value.trim(),dt=$('#nf-time').value,gate=$('#nf-gate').value.trim().toUpperCase(),cap=Number($('#nf-cap').value);if(!num||!dest||!city||!dt||!gate||!cap){toast('Complete all flight fields');return}let id=ac+num;if(flight(id)){toast('That flight number already exists');return}let f={id,flight:id,airline:ac,destination:dest,city,departure:new Date(dt).toISOString(),gate,capacity:cap,terminal:gate[0]==='D'?'T1':'T1',status:'Scheduled'};data.flights.push(f);record('Flight added to station',`${id} · ${dest} · Gate ${gate}`);save();closeModal();selectedFlight=id;go('counter');toast('Flight created')};$('#nf-airline').onchange=()=>{let a=airline($('#nf-airline').value);$('#nf-gate').placeholder=`${a.gates}`}})}
function newPassenger(){let f=flight(selectedFlight);if(!f)return;modal('Add walk-up passenger',`Add a passenger directly to ${f.id} · ${f.destination}.`,`<div class="form-grid"><div class="field"><label>First name</label><input id="np-first" class="input"></div><div class="field"><label>Last name</label><input id="np-last" class="input"></div><div class="field"><label>Document type</label><select id="np-doc" class="input"><option>Government ID</option><option>Passport</option><option>Military ID</option><option>Other approved ID</option></select></div><div class="field"><label>Fare</label><select id="np-fare" class="input"><option>Standard</option><option>Basic</option><option>First</option></select></div><div class="field"><label>Email</label><input id="np-email" class="input" type="email" placeholder="optional"></div><div class="field"><label>Phone</label><input id="np-phone" class="input" placeholder="optional"></div></div><div class="notice info">A walk-up record is created as document-verified for this simulation so you can proceed through the workflow.</div>`,`<button class="btn primary" id="create-pax">Create passenger</button>`,()=>{$('#create-pax').onclick=()=>{let firstName=$('#np-first').value.trim(),lastName=$('#np-last').value.trim();if(!firstName||!lastName){toast('Enter a first and last name');return}let id=`${f.id}-W${Math.floor(Math.random()*9000)+1000}`,a=airline(f.airline),x={id,flightId:f.id,first:firstName,last:lastName,record:(firstName[0]+lastName.slice(0,3)+Math.random().toString(36).slice(2,5)).toUpperCase(),seat:'',checked:false,boardingPass:false,group:a.groups[a.groups.length-2]||a.groups[0],bags:0,bagTags:[],bagWeight:[],docStatus:'Verified',docType:$('#np-doc').value,special:'',notes:'Walk-up passenger',fare:$('#np-fare').value,email:$('#np-email').value||'Not provided',phone:$('#np-phone').value||'Not provided',priority:false,ssr:''};data.passengers.push(x);record('Walk-up passenger added',`${firstName} ${lastName} · ${f.id}`);selectedPassenger=id;save();closeModal();render();toast('Passenger added to manifest')}})}
function go(p){page=p;filter='';render()}
$('#nav').addEventListener('click',e=>{let b=e.target.closest('[data-page]');if(b)go(b.dataset.page)});$('#clock').textContent=new Date().toLocaleDateString([], {weekday:'short',month:'short',day:'numeric'})+' · '+new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});setInterval(()=>{$('#clock').textContent=new Date().toLocaleDateString([], {weekday:'short',month:'short',day:'numeric'})+' · '+new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})},30000);
selectedFlight=data.flights[0]?.id;render();
})();
</script>
</body></html>
